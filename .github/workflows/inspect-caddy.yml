name: Fix Caddy TLS (itapoa.online)

on:
  workflow_dispatch:

jobs:
  inspect-caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Caddy + env
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "=== Caddyfile ==="
            cat /etc/caddy/Caddyfile 2>/dev/null || echo "no /etc/caddy/Caddyfile"
            echo "=== .env in app ==="
            ls -la /opt/itapoa/app/.env 2>/dev/null | head -5
            grep -E "^(APP_URL|API_URL|MERCADOPAGO|NODE_ENV|PORT)=" /opt/itapoa/app/.env 2>/dev/null | sed 's/=.*/=***/' | head -20 || echo "no .env or no matching vars"
            echo "=== pm2 env ==="
            pm2 env 0 2>/dev/null | grep -E "APP_URL|MERCADOPAGO|NODE_ENV" | sed 's/=.*/=***/' | head -20 || echo "no pm2 env"
            echo "=== ecosystem ==="
            cat /opt/itapoa/app/ecosystem.config.js 2>/dev/null | head -40 || echo "no ecosystem file"
            echo "=== done ==="
