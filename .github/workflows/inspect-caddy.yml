name: Fix Caddy TLS (itapoa.online)

on:
  workflow_dispatch:

jobs:
  inspect-caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect details
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "=== .env values (host only, no secrets) ==="
            echo "APP_URL=$(grep '^APP_URL=' /opt/itapoa/app/.env 2>/dev/null | cut -d= -f2)"
            echo "API_URL=$(grep '^API_URL=' /opt/itapoa/app/.env 2>/dev/null | cut -d= -f2)"
            echo "MERCADOPAGO_ACCESS_TOKEN present: $(grep -c '^MERCADOPAGO_ACCESS_TOKEN=..' /opt/itapoa/app/.env 2>/dev/null || echo 0)"
            echo "MERCADOPAGO_WEBHOOK_SECRET present: $(grep -c '^MERCADOPAGO_WEBHOOK_SECRET=..' /opt/itapoa/app/.env 2>/dev/null || echo 0)"
            echo "APP_URL host check: $(grep '^APP_URL=' /opt/itapoa/app/.env 2>/dev/null)"
            echo "=== Node .env via app ==="
            cd /opt/itapoa/app && node -e "require('dotenv').config(); console.log('APP_URL='+process.env.APP_URL); console.log('has MP token='+!!process.env.MERCADOPAGO_ACCESS_TOKEN); console.log('has MP webhook='+!!process.env.MERCADOPAGO_WEBHOOK_SECRET)" 2>&1 | head -20
            echo "=== done ==="
