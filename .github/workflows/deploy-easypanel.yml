name: Deploy Easypanel (itapoa.online)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'easypanel-deploy' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    services:
      payment-test-db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: payment-local-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 43316:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/server.cjs
          grep -q 'itapoa.online' dist/index.html
          echo "Build OK: $(wc -c < dist/server.cjs) bytes server.cjs"

      - name: Smoke test (offline database and release header)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '65534'
          DB_NAME: ci_offline
          DB_USER: ci_offline
          DB_PASSWORD: ci_offline
          JWT_SECRET: ci-only-not-a-production-secret-0123456789abcdef
        run: |
          node scripts/smoke-catalog.mjs --offline
          node --import tsx --test tests/unit/*.test.ts

      - name: Install payment test browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Payment backend and browser integration (isolated database, synthetic gateway)
        timeout-minutes: 5
        run: |
          node --import tsx --test tests/integration/*.test.ts

      - name: Deploy and verify on VPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script: |
            set -eu
            EXPECTED_SHA='${{ github.sha }}'
            REPO_URL='https://github.com/Ocorrosivo/itapoa-online.git'
            BUILD_DIR=$(mktemp -d /tmp/itapoa-deploy.XXXXXXXX)
            IMAGE="easypanel/itapoa/itapoa-app:$EXPECTED_SHA"
            SERVICE="itapoa_itapoa-app"

            echo "[deploy] Expected commit: $EXPECTED_SHA"
            git -C "$BUILD_DIR" init --quiet
            git -C "$BUILD_DIR" remote add origin "$REPO_URL"
            git -C "$BUILD_DIR" fetch --quiet --depth 1 origin "$EXPECTED_SHA"
            git -C "$BUILD_DIR" checkout --quiet --detach FETCH_HEAD
            ACTUAL_SHA=$(git -C "$BUILD_DIR" rev-parse HEAD)
            test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Commit mismatch: $ACTUAL_SHA != $EXPECTED_SHA"; exit 1; }
            echo "[deploy] Building $ACTUAL_SHA"
            # Read-only gate: deployment must never create/migrate payment tables.
            payment_container=$(docker ps --filter 'label=com.docker.swarm.service.name=itapoa_itapoa-app' --format '{{.ID}}' | head -n 1)
            test -n "$payment_container"
            # Refuse image replacement with ephemeral uploads. Storage migration
            # and external backup validation must happen separately.
            upload_target=$(docker exec "$payment_container" node -e 'console.log(require("path").resolve(process.env.UPLOAD_DIR||"uploads"))')
            docker service inspect "$SERVICE" --format '{{json .Spec.TaskTemplate.ContainerSpec.Mounts}}' | docker exec -i -e AUDIT_UPLOAD_TARGET="$upload_target" "$payment_container" node -e '
              let input="";process.stdin.on("data",c=>input+=c);process.stdin.on("end",()=>{
                const target=process.env.AUDIT_UPLOAD_TARGET;
                const persistent=(JSON.parse(input)||[]).some(m=>["bind","volume"].includes(m.Type)&&!m.ReadOnly&&m.Target!=="/"&&(target===m.Target||target.startsWith(m.Target+"/")));
                if(!persistent){console.error("Uploads are not persistent. Validate external backups and migrate storage before deployment. No deployment performed.");process.exitCode=1;}
              });'
            docker exec -i "$payment_container" node - <<'NODE'
            const mysql = require('mysql2/promise');
            (async () => {
              const db=await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
              try {
                await db.query('SELECT payment_id, subscription_id, remote_updated_at, activated_at, expires_at FROM gateway_payment_state LIMIT 0');
                await db.query('SELECT gateway_event_id, attempts, status FROM webhook_events LIMIT 0');
                await db.query('SELECT version, is_active, allow_new_subscriptions FROM plans LIMIT 0');
                await db.query('SELECT user_id, version FROM user_auth_state LIMIT 0');
                const [admins]=await db.query("SELECT COUNT(*) total FROM users WHERE role='admin_master'");
                if(!Number(admins[0].total))throw new Error('Administrator role must be explicitly configured before deployment');
                console.log('Payment schema preflight: OK');
              } finally { await db.end(); }
            })().catch(()=>{console.error('Runtime preflight failed: check the reviewed payment/auth schema and an explicitly configured admin role. No deployment performed.');process.exitCode=1;});
            NODE
            docker build --pull --build-arg RELEASE_SHA="$EXPECTED_SHA" -t "$IMAGE" "$BUILD_DIR"

            # Deploy changes only the image; payment/SMTP settings stay in Easypanel.
            docker service inspect "$SERVICE" --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}} {{json .Spec.TaskTemplate.ContainerSpec.Mounts}}' > "$BUILD_DIR/runtime-before"

            PREVIOUS_IMAGE=$(docker service inspect "$SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            rollback() {
              result=$?
              trap - EXIT
              if [ "$result" -ne 0 ]; then
                echo "[deploy] Failed; restoring $PREVIOUS_IMAGE"
                docker service update --image "$PREVIOUS_IMAGE" --force "$SERVICE" || true
              fi
              exit "$result"
            }
            trap rollback EXIT

            echo "[deploy] Updating $SERVICE"
            docker service update --image "$IMAGE" --force "$SERVICE"
            docker service inspect "$SERVICE" --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}} {{json .Spec.TaskTemplate.ContainerSpec.Mounts}}' > "$BUILD_DIR/runtime-after"
            cmp -s "$BUILD_DIR/runtime-before" "$BUILD_DIR/runtime-after" || { echo 'Runtime settings changed unexpectedly'; exit 1; }
            echo '[deploy] Existing environment and mounts preserved'

            echo "[deploy] Waiting for exact image task to run"
            converged=0
            for attempt in $(seq 1 36); do
              task=$(docker service ps "$SERVICE" --no-trunc --format '{{.CurrentState}} {{.Image}}' | head -n 1)
              echo "[$attempt] $task"
              case "$task" in
                "Running"*"$IMAGE"*) converged=1; break ;;
                "Failed"*|"Rejected"*|"Shutdown"*)
                  docker service ps "$SERVICE" --no-trunc | head -n 20
                  exit 1
                  ;;
              esac
              sleep 5
            done
            test "$converged" = 1 || { docker service ps "$SERVICE" --no-trunc | head -n 20; exit 1; }

            echo "[deploy] Waiting for application health inside the exact container"
            healthy=0
            for attempt in $(seq 1 24); do
              container=$(docker ps --filter "label=com.docker.swarm.service.name=$SERVICE" --filter "ancestor=$IMAGE" --format '{{.ID}}' | head -n 1)
              body=""
              if [ -n "$container" ]; then
                body=$(docker exec "$container" node -e 'fetch("http://127.0.0.1:"+(process.env.PORT||3000)+"/api/health",{signal:AbortSignal.timeout(5000)}).then(async r=>{if(!r.ok)process.exit(1);console.log(await r.text())}).catch(()=>process.exit(1))' || true)
              fi
              echo "[$attempt] $body"
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"connected"'; then
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = 1 || { docker service logs "$SERVICE" --tail 100; exit 1; }

            echo "[deploy] Verifying expected frontend assets from running container"
            container=$(docker ps --filter "label=com.docker.swarm.service.name=$SERVICE" --filter "ancestor=$IMAGE" --format '{{.ID}}' | head -n 1)
            test -n "$container"
            asset=$(docker exec "$container" sh -lc "grep -o 'assets/index-[^\"]*\\.js' /app/dist/index.html | head -n 1")
            test -n "$asset"
            echo "[deploy] Commit=$ACTUAL_SHA asset=$asset image=$IMAGE"

            echo "[deploy] Waiting for canonical HTTPS health"
            healthy=0
            for attempt in $(seq 1 18); do
              body=$(curl --fail --silent --show-error --max-time 10 -D "$BUILD_DIR/health-headers" "https://itapoa.online/api/health?release=$EXPECTED_SHA" || true)
              echo "[$attempt] $body"
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"connected"' && grep -iq "^x-release-sha: $EXPECTED_SHA" "$BUILD_DIR/health-headers"; then
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = 1 || { echo "Canonical health failed for $EXPECTED_SHA"; exit 1; }
            curl --fail --silent --show-error --max-time 15 -o "$BUILD_DIR/public-index.html" "https://itapoa.online/?release=$EXPECTED_SHA"
            grep -Fq "$asset" "$BUILD_DIR/public-index.html"
            echo "DEPLOY_VERIFIED commit=$ACTUAL_SHA image=$IMAGE asset=$asset"
