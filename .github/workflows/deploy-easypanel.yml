name: Deploy Easypanel (itapoa.online)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: easypanel-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/server.cjs
          grep -q 'itapoa.online' dist/index.html
          echo "Build OK: $(wc -c < dist/server.cjs) bytes server.cjs"

      - name: Deploy and verify on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script: |
            set -eu
            EXPECTED_SHA='${{ github.sha }}'
            REPO_URL='https://github.com/Ocorrosivo/itapoa-online.git'
            BUILD_DIR="/tmp/itapoa-deploy-$EXPECTED_SHA"
            IMAGE="easypanel/itapoa/itapoa-app:$EXPECTED_SHA"
            SERVICE="itapoa_itapoa-app"

            echo "[deploy] Expected commit: $EXPECTED_SHA"
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"
            git clone --quiet --depth 1 --branch main "$REPO_URL" "$BUILD_DIR"
            ACTUAL_SHA=$(git -C "$BUILD_DIR" rev-parse HEAD)
            test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Commit mismatch: $ACTUAL_SHA != $EXPECTED_SHA"; exit 1; }
            echo "[deploy] Building $ACTUAL_SHA"
            docker build --pull -t "$IMAGE" "$BUILD_DIR"

            echo "[deploy] Updating $SERVICE"
            docker service update --image "$IMAGE" --force "$SERVICE"

            echo "[deploy] Waiting for exact image task to run"
            converged=0
            for attempt in $(seq 1 36); do
              task=$(docker service ps "$SERVICE" --no-trunc --format '{{.CurrentState}} {{.Image}}' | head -n 1)
              echo "[$attempt] $task"
              case "$task" in
                "Running"*"$IMAGE"*) converged=1; break ;;
                "Failed"*|"Rejected"*|"Shutdown"*)
                  docker service ps "$SERVICE" --no-trunc | head -n 20
                  exit 1
                  ;;
              esac
              sleep 5
            done
            test "$converged" = 1 || { docker service ps "$SERVICE" --no-trunc | head -n 20; exit 1; }

            echo "[deploy] Waiting for local application health"
            healthy=0
            for attempt in $(seq 1 24); do
              body=$(curl --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health || true)
              echo "[$attempt] $body"
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"connected"'; then
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = 1 || { docker service logs "$SERVICE" --tail 100; exit 1; }

            echo "[deploy] Verifying expected frontend assets from running container"
            container=$(docker ps --filter "label=com.docker.swarm.service.name=$SERVICE" --format '{{.ID}}' | head -n 1)
            test -n "$container"
            asset=$(docker exec "$container" sh -lc "grep -o 'assets/index-[^\"]*\\.js' /app/dist/index.html | head -n 1")
            test -n "$asset"
            echo "[deploy] Commit=$ACTUAL_SHA asset=$asset image=$IMAGE"

            echo "[deploy] Waiting for canonical HTTPS health"
            healthy=0
            for attempt in $(seq 1 18); do
              body=$(curl --silent --show-error --max-time 10 https://itapoa.online/api/health || true)
              echo "[$attempt] $body"
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"connected"'; then
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = 1 || { echo "Canonical health failed for $EXPECTED_SHA"; exit 1; }
            echo "DEPLOY_VERIFIED commit=$ACTUAL_SHA image=$IMAGE asset=$asset"
