name: Deploy Easypanel (itapoa.online)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: easypanel-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/server.cjs
          grep -q 'itapoa.online' dist/index.html
          echo "Build OK: $(wc -c < dist/server.cjs) bytes server.cjs"

      - name: Smoke test (offline database and release header)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '65534'
          DB_NAME: ci_offline
          DB_USER: ci_offline
          DB_PASSWORD: ci_offline
          JWT_SECRET: ci-only-not-a-production-secret-0123456789abcdef
        run: |
          node scripts/smoke-catalog.mjs --offline
          node --import tsx --test tests/unit/checkout.test.ts
          node --import tsx --test tests/unit/password-recovery.test.ts
          node --import tsx --test tests/unit/email-verification.test.ts

      - name: Deploy and verify on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          MP_PUBLIC_KEY: ${{ secrets.MERCADOPAGO_PUBLIC_KEY }}
          MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          envs: MP_PUBLIC_KEY,MP_ACCESS_TOKEN,MP_WEBHOOK_SECRET
          script: |
            set -eu
            EXPECTED_SHA='${{ github.sha }}'
            REPO_URL='https://github.com/Ocorrosivo/itapoa-online.git'
            BUILD_DIR=$(mktemp -d /tmp/itapoa-deploy.XXXXXXXX)
            IMAGE="easypanel/itapoa/itapoa-app:$EXPECTED_SHA"
            SERVICE="itapoa_itapoa-app"

            echo "[deploy] Expected commit: $EXPECTED_SHA"
            git -C "$BUILD_DIR" init --quiet
            git -C "$BUILD_DIR" remote add origin "$REPO_URL"
            git -C "$BUILD_DIR" fetch --quiet --depth 1 origin "$EXPECTED_SHA"
            git -C "$BUILD_DIR" checkout --quiet --detach FETCH_HEAD
            ACTUAL_SHA=$(git -C "$BUILD_DIR" rev-parse HEAD)
            test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Commit mismatch: $ACTUAL_SHA != $EXPECTED_SHA"; exit 1; }
            echo "[deploy] Building $ACTUAL_SHA"
            docker build --pull --build-arg RELEASE_SHA="$EXPECTED_SHA" -t "$IMAGE" "$BUILD_DIR"

            # Secrets are delivered through encrypted GitHub secrets, never committed or printed.
            set --
            if [ -n "${MP_PUBLIC_KEY:-}${MP_ACCESS_TOKEN:-}${MP_WEBHOOK_SECRET:-}" ]; then
              test -n "${MP_PUBLIC_KEY:-}" && test -n "${MP_ACCESS_TOKEN:-}" && test -n "${MP_WEBHOOK_SECRET:-}" || { echo 'Incomplete payment configuration; no settings changed'; exit 1; }
              current_container=$(docker ps --filter "label=com.docker.swarm.service.name=$SERVICE" --format '{{.ID}}' | head -n 1)
              test -n "$current_container"
              # Read-only authentication check before changing the service. No payments are created.
              docker exec -i -e MP_ACCESS_TOKEN "$current_container" node - <<'NODE'
            fetch('https://api.mercadopago.com/users/me', {
              headers: { Authorization: 'Bearer ' + process.env.MP_ACCESS_TOKEN },
              signal: AbortSignal.timeout(15000)
            }).then(response => {
              if (!response.ok) throw new Error('Mercado Pago authentication failed (HTTP ' + response.status + ')');
              console.log('Mercado Pago read-only authentication: OK');
            }).catch(error => { console.error(error.message); process.exitCode = 1; });
            NODE
              set -- --env-add "MERCADOPAGO_PUBLIC_KEY=$MP_PUBLIC_KEY" --env-add "MERCADOPAGO_ACCESS_TOKEN=$MP_ACCESS_TOKEN" --env-add "MERCADOPAGO_WEBHOOK_SECRET=$MP_WEBHOOK_SECRET" --env-add 'APP_URL=https://itapoa.online' --env-add 'API_URL=https://itapoa.online/api'
            fi

            PREVIOUS_IMAGE=$(docker service inspect "$SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            rollback() {
              result=$?
              trap - EXIT
              if [ "$result" -ne 0 ]; then
                echo "[deploy] Failed; restoring $PREVIOUS_IMAGE"
                docker service update --image "$PREVIOUS_IMAGE" --force "$SERVICE" || true
              fi
              exit "$result"
            }
            trap rollback EXIT

            echo "[deploy] Updating $SERVICE"
            docker service update --image "$IMAGE" "$@" --force "$SERVICE"

            echo "[deploy] Waiting for exact image task to run"
            converged=0
            for attempt in $(seq 1 36); do
              task=$(docker service ps "$SERVICE" --no-trunc --format '{{.CurrentState}} {{.Image}}' | head -n 1)
              echo "[$attempt] $task"
              case "$task" in
                "Running"*"$IMAGE"*) converged=1; break ;;
                "Failed"*|"Rejected"*|"Shutdown"*)
                  docker service ps "$SERVICE" --no-trunc | head -n 20
                  exit 1
                  ;;
              esac
              sleep 5
            done
            test "$converged" = 1 || { docker service ps "$SERVICE" --no-trunc | head -n 20; exit 1; }

            echo "[deploy] Waiting for application health inside the exact container"
            healthy=0
            for attempt in $(seq 1 24); do
              container=$(docker ps --filter "label=com.docker.swarm.service.name=$SERVICE" --filter "ancestor=$IMAGE" --format '{{.ID}}' | head -n 1)
              body=""
              if [ -n "$container" ]; then
                body=$(docker exec "$container" node -e 'fetch("http://127.0.0.1:"+(process.env.PORT||3000)+"/api/health",{signal:AbortSignal.timeout(5000)}).then(async r=>{if(!r.ok)process.exit(1);console.log(await r.text())}).catch(()=>process.exit(1))' || true)
              fi
              echo "[$attempt] $body"
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"connected"'; then
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = 1 || { docker service logs "$SERVICE" --tail 100; exit 1; }

            echo "[deploy] Verifying expected frontend assets from running container"
            container=$(docker ps --filter "label=com.docker.swarm.service.name=$SERVICE" --filter "ancestor=$IMAGE" --format '{{.ID}}' | head -n 1)
            test -n "$container"
            asset=$(docker exec "$container" sh -lc "grep -o 'assets/index-[^\"]*\\.js' /app/dist/index.html | head -n 1")
            test -n "$asset"
            echo "[deploy] Commit=$ACTUAL_SHA asset=$asset image=$IMAGE"

            echo "[deploy] Waiting for canonical HTTPS health"
            healthy=0
            for attempt in $(seq 1 18); do
              body=$(curl --fail --silent --show-error --max-time 10 -D "$BUILD_DIR/health-headers" "https://itapoa.online/api/health?release=$EXPECTED_SHA" || true)
              echo "[$attempt] $body"
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"connected"' && grep -iq "^x-release-sha: $EXPECTED_SHA" "$BUILD_DIR/health-headers"; then
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = 1 || { echo "Canonical health failed for $EXPECTED_SHA"; exit 1; }
            if [ "$#" -gt 0 ]; then
              docker exec -i -e MP_PUBLIC_KEY "$container" node - <<'NODE'
            fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/payments/config', {
              signal: AbortSignal.timeout(10000)
            }).then(async response => {
              if (!response.ok) throw new Error('Payment configuration check failed');
              const config = await response.json();
              if (!config.pixEnabled || !config.cardEnabled || config.publicKey !== process.env.MP_PUBLIC_KEY) {
                throw new Error('Payment configuration incomplete');
              }
              console.log('Payment configuration: card and Pix enabled');
            }).catch(error => { console.error(error.message); process.exitCode = 1; });
            NODE
            fi
            curl --fail --silent --show-error --max-time 15 -o "$BUILD_DIR/public-index.html" "https://itapoa.online/?release=$EXPECTED_SHA"
            grep -Fq "$asset" "$BUILD_DIR/public-index.html"
            echo "DEPLOY_VERIFIED commit=$ACTUAL_SHA image=$IMAGE asset=$asset"
