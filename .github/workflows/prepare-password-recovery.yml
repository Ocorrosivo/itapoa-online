name: Preparar recuperacao de senha (backup e banco)

on:
  workflow_dispatch:
  push:
    branches: [codex/password-recovery-activation]
    paths:
      - .github/workflows/prepare-password-recovery.yml

permissions:
  contents: read

concurrency:
  group: easypanel-deploy
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Backup antes de criar somente as tabelas de recuperacao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 12m
          script: |
            set -eu
            umask 077
            SERVICE=itapoa_itapoa-app
            container=$(docker ps --filter "label=com.docker.swarm.service.name=$SERVICE" --format '{{.ID}}' | head -n 1)
            test -n "$container"
            # Names/booleans only: never print environment values or raw SMTP errors.
            docker exec -i "$container" node - <<'NODE'
            const mysql = require('mysql2/promise');
            (async () => {
              for (const name of ['SMTP_HOST','SMTP_PORT','SMTP_USER','SMTP_PASSWORD','SMTP_PASS','SMTP_FROM','EMAIL_FROM']) {
                console.log(name + ': ' + (process.env[name] ? 'configured' : 'missing'));
              }
              const db = await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
              try { await db.query('SELECT 1'); console.log('Current application database: connected'); }
              finally { await db.end(); }
            })().catch(() => { console.error('Database preflight failed; no changes made'); process.exitCode=1; });
            NODE

            mkdir -p /var/backups/itapoa
            backup=$(mktemp -d /var/backups/itapoa/password-recovery.XXXXXXXX)
            chmod 700 "$backup"
            # Credentials stay on the VPS in a mode-600 file, never in logs/artifacts.
            docker exec "$container" node -e 'for(const k of ["DB_HOST","DB_PORT","DB_NAME","DB_USER","DB_PASSWORD"]){const v=process.env[k]||"";if(/[\r\n]/.test(v))process.exit(1);process.stdout.write(k+"="+v+"\n")}' > "$backup/db.env"
            chmod 600 "$backup/db.env"
            flavor=$(docker exec "$container" node -e 'const m=require("mysql2/promise");(async()=>{const c=await m.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});try{const [r]=await c.query("SELECT VERSION() AS v");console.log(/mariadb/i.test(r[0].v)?"mariadb":"mysql")}finally{await c.end()}})().catch(()=>process.exit(1))')
            case "$flavor" in
              mariadb) client_image=mariadb:11.4; dump_command=mariadb-dump ;;
              mysql) client_image=mysql:8.4; dump_command=mysqldump ;;
              *) echo 'Unknown database flavor; aborting'; exit 1 ;;
            esac
            docker pull "$client_image" >/dev/null
            docker run --rm --network "container:$container" --env-file "$backup/db.env" -e DUMP_COMMAND="$dump_command" --entrypoint sh "$client_image" -c '
              export MYSQL_PWD="$DB_PASSWORD"
              exec "$DUMP_COMMAND" --host="$DB_HOST" --port="${DB_PORT:-3306}" --user="$DB_USER" --single-transaction --quick --skip-lock-tables --no-tablespaces --routines --events --triggers --hex-blob "$DB_NAME"
            ' > "$backup/database.sql" 2> "$backup/dump.stderr"
            test -s "$backup/database.sql"
            grep -q 'CREATE TABLE.*users' "$backup/database.sql"
            grep -q 'CREATE TABLE.*companies' "$backup/database.sql"
            gzip "$backup/database.sql"
            gzip -t "$backup/database.sql.gz"
            sha256sum "$backup/database.sql.gz" > "$backup/database.sha256"
            sha256sum -c "$backup/database.sha256"
            echo "BACKUP_VERIFIED directory=$backup"

            # Explicitly authorized additive migration, separate from deployment.
            # Align FK charset/collation to users.id; never change existing rows.
            docker exec -i "$container" node - <<'NODE'
            const mysql = require('mysql2/promise');
            (async () => {
              const db = await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
              try {
                const [meta] = await db.query("SELECT COLUMN_TYPE, CHARACTER_SET_NAME, COLLATION_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='users' AND COLUMN_NAME='id'");
                const col=meta[0];
                if(!col || col.COLUMN_TYPE.toLowerCase()!=='varchar(255)' || !/^[a-z0-9_]+$/i.test(col.CHARACTER_SET_NAME) || !/^[a-z0-9_]+$/i.test(col.COLLATION_NAME)) throw new Error('Unexpected user key schema');
                const suffix=`ENGINE=InnoDB DEFAULT CHARSET=${col.CHARACTER_SET_NAME} COLLATE=${col.COLLATION_NAME}`;
                const [before]=await db.query('SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM companies) AS companies');
                await db.query(`CREATE TABLE IF NOT EXISTS password_reset_tokens (
                  user_id VARCHAR(255) PRIMARY KEY, token_hash CHAR(64) NOT NULL UNIQUE,
                  password_fingerprint CHAR(64) NOT NULL, expires_at DATETIME(3) NOT NULL,
                  created_at DATETIME(3) NOT NULL, used_at DATETIME(3) NULL,
                  FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
                ) ${suffix}`);
                await db.query(`CREATE TABLE IF NOT EXISTS user_auth_state (
                  user_id VARCHAR(255) PRIMARY KEY, version INT UNSIGNED NOT NULL DEFAULT 0,
                  FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
                ) ${suffix}`);
                await db.query('SELECT user_id, token_hash, password_fingerprint, expires_at, created_at, used_at FROM password_reset_tokens LIMIT 0');
                await db.query('SELECT user_id, version FROM user_auth_state LIMIT 0');
                const [after]=await db.query('SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM companies) AS companies');
                console.log('RECOVERY_SCHEMA_READY: tables available; no users/passwords/companies modified');
                console.log('Counts before/after:', JSON.stringify({before:before[0],after:after[0]}));
              } finally { await db.end(); }
            })().catch(() => { console.error('Recovery migration failed; backup retained; no destructive rollback attempted'); process.exitCode=1; });
            NODE
