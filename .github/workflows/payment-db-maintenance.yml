name: Payment database maintenance (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Leave empty for inspection. Explicit authorization: backup-and-migrate-itapoa'
        required: false
        type: string

concurrency:
  group: easypanel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    if: inputs.confirmation == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect payment database without changing it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 3m
          script: |
            set -eu
            container=$(docker ps --filter 'label=com.docker.swarm.service.name=itapoa_itapoa-app' --format '{{.ID}}' | head -n 1)
            test -n "$container"
            docker service inspect itapoa_itapoa-app --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
            docker ps --format '{{.Names}} {{.Image}}'
            command -v mysqldump || command -v mariadb-dump || true
            df -h /var/lib/docker
            docker exec -i "$container" node - <<'NODE'
            const mysql=require('mysql2/promise');
            (async()=>{
              const db=await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
              try {
                const [identity]=await db.query('SELECT DATABASE() db, VERSION() version');
                const [tables]=await db.query('SELECT TABLE_NAME name, ENGINE engine FROM information_schema.tables WHERE TABLE_SCHEMA=DATABASE() ORDER BY TABLE_NAME');
                const [columns]=await db.query("SELECT TABLE_NAME name,COLUMN_NAME col FROM information_schema.columns WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('gateway_payment_state','webhook_events','plans') ORDER BY TABLE_NAME,ORDINAL_POSITION");
                const counts={};for(const t of ['users','companies','subscriptions','payment_logs']) counts[t]=(await db.query('SELECT COUNT(*) n FROM `'+t+'`'))[0][0].n;
                console.log(JSON.stringify({identity,host:process.env.DB_HOST,tables,columns,counts}));
              } finally {await db.end();}
            })().catch(e=>{console.error('Inspection failed:',e.code||'unknown');process.exitCode=1;});
            NODE
  backup-and-migrate:
    if: inputs.confirmation == 'backup-and-migrate-itapoa'
    runs-on: ubuntu-24.04
    steps:
      - name: Backup, isolated restore and additive migration
        uses: appleboy/ssh-action@v1.2.0
        env:
          PAYMENT_MAINTENANCE_CONFIRM: ${{ inputs.confirmation }}
          MAINTENANCE_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: PAYMENT_MAINTENANCE_CONFIRM,MAINTENANCE_RUN_ID
          command_timeout: 10m
          script: |
            set -eu
            umask 077
            test "$PAYMENT_MAINTENANCE_CONFIRM" = backup-and-migrate-itapoa
            source_dir=$(mktemp -d /tmp/itapoa-payment-maintenance.XXXXXXXX)
            git -C "$source_dir" init --quiet
            git -C "$source_dir" remote add origin https://github.com/Ocorrosivo/itapoa-online.git
            git -C "$source_dir" fetch --quiet --depth 1 origin '${{ github.sha }}'
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = '${{ github.sha }}'
            bash -n "$source_dir/scripts/payment-db-maintenance.sh"
            GITHUB_RUN_ID="$MAINTENANCE_RUN_ID" bash "$source_dir/scripts/payment-db-maintenance.sh" "$source_dir"
  inspect-smtp:
    if: inputs.confirmation == 'inspect-smtp'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify current application SMTP without sending email
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 2m
          script: |
            set -eu
            container=$(docker ps --filter 'label=com.docker.swarm.service.name=itapoa_itapoa-app' --format '{{.ID}}')
            test -n "$container"
            docker exec -i "$container" node - <<'NODE'
            const nodemailer=require('nodemailer');
            const mysql=require('mysql2/promise');
            (async()=>{
              const e=process.env;
              const db=await mysql.createConnection({host:e.DB_HOST,port:Number(e.DB_PORT||3306),user:e.DB_USER,password:e.DB_PASSWORD,database:e.DB_NAME});
              try {
                const [users]=await db.query('SELECT id,password FROM users WHERE LOWER(email)=? LIMIT 1',['blocosgiga@gmail.com']);
                const account=users[0];
                const [companies]=await db.query('SELECT id FROM companies WHERE id=? OR slug=? LIMIT 1',['checkout_001bff79bf5f66d7d5b12c00','checkout_001bff79bf5f66d7d5b12c00']);
                let companyLinkedUsers=0,companyLinkedEmailMatches=false;
                if(companies[0]){
                  const [bindings]=await db.query('SELECT COUNT(*) n,COALESCE(SUM(LOWER(TRIM(u.email))=?),0) matchesTarget FROM companies_users cu JOIN users u ON u.id=cu.user_id WHERE cu.company_id=?',['blocosgiga@gmail.com',companies[0].id]);
                  companyLinkedUsers=Number(bindings[0].n);companyLinkedEmailMatches=Number(bindings[0].matchesTarget)>0;
                }
                let schemaReady=true,recentRequest=false,unexpiredRequest=false;
                try {
                  await db.query('SELECT user_id,token_hash,password_fingerprint,expires_at,created_at,used_at FROM password_reset_tokens LIMIT 0');
                  await db.query('SELECT user_id,version FROM user_auth_state LIMIT 0');
                  if(account){const [tokens]=await db.query('SELECT created_at>DATE_SUB(UTC_TIMESTAMP(3),INTERVAL 60 SECOND) recent,expires_at>UTC_TIMESTAMP(3) AND used_at IS NULL unexpired FROM password_reset_tokens WHERE user_id=?',[account.id]);recentRequest=!!tokens[0]?.recent;unexpiredRequest=!!tokens[0]?.unexpired;}
                } catch {schemaReady=false;}
                console.log(JSON.stringify({accountExists:!!account,passwordLoginEligible:!!account&&/^\$2[aby]\$/.test(account.password||''),companyExists:!!companies[0],companyLinkedUsers,companyLinkedEmailMatches,recoverySchemaReady:schemaReady,recentRequest,unexpiredRequest}));
              }finally{await db.end();}
              const host=(e.SMTP_HOST||'smtp.hostinger.com').trim();
              const port=Number(e.SMTP_PORT||465);
              const user=(e.SMTP_USER||e.SMTP_USERNAME||'contato@itapoa.online').trim();
              const from=(e.SMTP_FROM||e.EMAIL_FROM||'contato@itapoa.online').trim();
              const pass=e.SMTP_PASSWORD||e.SMTP_PASS;
              console.log(JSON.stringify({host,port,user,from,passwordPresent:!!pass,explicitRecoveryFieldsPresent:!!(e.SMTP_HOST?.trim()&&e.SMTP_USER?.trim()&&(e.SMTP_FROM||e.EMAIL_FROM)?.trim()),appUrl:e.APP_URL}));
              if(!pass||![465,587].includes(port))throw Object.assign(new Error('missing_configuration'),{code:'CONFIG_MISSING'});
              const transport=nodemailer.createTransport({host,port,secure:port===465,requireTLS:port===587,auth:{user,pass},tls:{rejectUnauthorized:true,minVersion:'TLSv1.2'},connectionTimeout:10000,greetingTimeout:10000,socketTimeout:15000,logger:false,debug:false});
              try{await transport.verify();console.log('SMTP_CONNECTION_AND_AUTHENTICATION=OK; NO_EMAIL_SENT');}finally{transport.close();}
            })().catch(e=>{console.error(JSON.stringify({smtpVerified:false,code:e.code||'SMTP_FAILURE',command:e.command||null,responseCode:e.responseCode||null}));process.exitCode=1;});
            NODE
