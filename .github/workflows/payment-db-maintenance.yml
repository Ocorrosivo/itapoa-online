name: Payment database maintenance (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Leave empty for inspection. Explicit authorization: backup-and-migrate-itapoa'
        required: false
        type: string

concurrency:
  group: easypanel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-upload-persistence:
    if: inputs.confirmation == 'verify-upload-persistence'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify saved volume survives a controlled task recreation
        uses: appleboy/ssh-action@v1.2.0
        env:
          PERSISTENCE_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: PERSISTENCE_RUN_ID
          command_timeout: 5m
          script: |
            set -eu
            service=itapoa_itapoa-app
            backup=/var/backups/itapoa/site-20261023T055338Z-39908273388
            test -f "$backup/VERIFIED.txt"
            test "$(sha256sum "$backup/bundle.tar.gz" | cut -d' ' -f1)" = 96e264a8fb460fd7c39373302f31f0a24467b803cdd8e19447495206ddebf340
            before=$(docker ps --filter "label=com.docker.swarm.service.name=$service" --format '{{.ID}}' | head -n 1)
            test -n "$before"
            docker service inspect "$service" --format '{{json .Spec.TaskTemplate.ContainerSpec.Mounts}}' | docker exec -i "$before" node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const m=JSON.parse(s)||[];if(!m.some(x=>["bind","volume"].includes(x.Type)&&x.Target==="/app/uploads"&&!x.ReadOnly))process.exit(1);console.log("PERSISTENT_UPLOAD_MOUNT_PRESENT=OK")})'
            env_before=$(docker service inspect "$service" --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' | sha256sum | cut -d' ' -f1)
            image_before=$(docker service inspect "$service" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            content_before=$(docker inspect "$before" --format '{{.Image}}')
            file="itapoa-persistence-check-$PERSISTENCE_RUN_ID.png"
            docker exec -e CHECK_FILE="$file" "$before" node -e 'const f=require("fs"),p=require("path");if(!/^itapoa-persistence-check-[0-9]+\.png$/.test(process.env.CHECK_FILE))process.exit(1);f.writeFileSync(p.join("/app/uploads",process.env.CHECK_FILE),Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII=","base64"),{flag:"wx"});'
            file_hash=$(docker exec -e CHECK_FILE="$file" "$before" node -e 'console.log(require("crypto").createHash("sha256").update(require("fs").readFileSync(require("path").join("/app/uploads",process.env.CHECK_FILE))).digest("hex"))')
            docker service update --force "$service"
            after=$(docker ps --filter "label=com.docker.swarm.service.name=$service" --format '{{.ID}}' | head -n 1)
            test -n "$after"
            test "$before" != "$after"
            test "$content_before" = "$(docker inspect "$after" --format '{{.Image}}')" || { echo 'Container image content changed unexpectedly'; exit 1; }
            test "$env_before" = "$(docker service inspect "$service" --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' | sha256sum | cut -d' ' -f1)" || { echo 'Runtime environment changed unexpectedly'; exit 1; }
            docker exec -i -e CHECK_FILE="$file" -e EXPECTED_HASH="$file_hash" "$after" node - <<'NODE'
            const fs=require('fs'),path=require('path'),crypto=require('crypto');
            (async()=>{
              const file=path.join('/app/uploads',process.env.CHECK_FILE);
              const digest=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
              if(digest(fs.readFileSync(file))!==process.env.EXPECTED_HASH)throw new Error('Stored file changed');
              let ok=false;for(let i=0;i<20;i++){
                try{const response=await fetch('https://itapoa.online/uploads/'+process.env.CHECK_FILE,{signal:AbortSignal.timeout(5000)});if(response.ok&&digest(Buffer.from(await response.arrayBuffer()))===process.env.EXPECTED_HASH){ok=true;break;}}catch{}
                await new Promise(r=>setTimeout(r,1000));
              }
              if(!ok)throw new Error('Public file validation failed');
              const mysql=require('mysql2/promise');const db=await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
              try{const [admins]=await db.query("SELECT COUNT(*) total FROM users WHERE role='admin_master'");console.log(JSON.stringify({administratorRoleCount:admins[0].total}));}finally{await db.end();}
              fs.unlinkSync(file);
              for(const previous of ['39964799470','39965114150']){
                const diagnostic=path.join('/app/uploads','itapoa-persistence-check-'+previous+'.png');
                if(fs.existsSync(diagnostic)&&digest(fs.readFileSync(diagnostic))===process.env.EXPECTED_HASH)fs.unlinkSync(diagnostic);
              }
              console.log('UPLOAD_PERSISTENCE_AFTER_TASK_RECREATION=OK');
              console.log('TEMPORARY_SYNTHETIC_IMAGE_REMOVED=OK');
            })().catch(()=>{console.error('Persistence verification failed; inspect before publishing');process.exitCode=1;});
            NODE
  inspect-controller:
    if: inputs.confirmation == 'inspect-controller'
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect saved Easypanel configuration metadata only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 2m
          script: |
            set -eu
            docker service inspect easypanel --format '{{json .Spec.TaskTemplate.ContainerSpec.Mounts}}'
            app=$(docker ps --filter 'label=com.docker.swarm.service.name=itapoa_itapoa-app' --format '{{.ID}}' | head -n 1)
            image=$(docker inspect "$app" --format '{{.Image}}')
            docker run --rm -i --network none --mount type=bind,source=/etc/easypanel,target=/control,readonly "$image" node - <<'NODE'
            const fs=require('fs'),path=require('path');
            for(const directory of ['/control','/control/data','/control/projects/itapoa','/control/projects/itapoa/itapoa-app']){
              if(!fs.existsSync(directory))continue;
              console.log(JSON.stringify({directory,entries:fs.readdirSync(directory)}));
              for(const name of fs.readdirSync(directory).filter(n=>n.endsWith('.json'))){
                const file=path.join(directory,name);if(!fs.statSync(file).isFile())continue;
                try{const data=JSON.parse(fs.readFileSync(file,'utf8'));console.log(JSON.stringify({file,keys:Object.keys(data)}));}catch{}
              }
            }
            NODE
  create-verified-backup:
    if: inputs.confirmation == 'create-verified-backup'
    runs-on: ubuntu-24.04
    steps:
      - name: Backup, isolated restore and expiring download-only access
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKUP_PUBLIC_KEY: ${{ secrets.ITAPOA_BACKUP_TRANSFER_PUBLIC_KEY }}
          BACKUP_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: BACKUP_PUBLIC_KEY,BACKUP_RUN_ID
          command_timeout: 10m
          script: |
            set -eu
            umask 077
            source_dir=$(mktemp -d /tmp/itapoa-backup-source.XXXXXXXX)
            git -C "$source_dir" init --quiet
            git -C "$source_dir" remote add origin https://github.com/Ocorrosivo/itapoa-online.git
            git -C "$source_dir" fetch --quiet --depth 1 origin '${{ github.sha }}'
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = '${{ github.sha }}'
            bash -n "$source_dir/scripts/create-production-backup.sh"
            BACKUP_CONFIRMATION=create-verified-backup GITHUB_RUN_ID="$BACKUP_RUN_ID" bash "$source_dir/scripts/create-production-backup.sh" "$source_dir" > "$source_dir/backup-result.txt"
            cat "$source_dir/backup-result.txt"
            backup=$(sed -n 's/^VERIFIED_BACKUP_DIRECTORY=//p' "$source_dir/backup-result.txt")
            case "$backup" in /var/backups/itapoa/site-*) ;; *) exit 1;; esac
            test -f "$backup/VERIFIED.txt"
            test -f "$backup/bundle.tar.gz"
            test "$backup" = "$(realpath "$backup")"
            read -r key_type key_data ignored <<EOF
            $BACKUP_PUBLIC_KEY
            EOF
            test "$key_type" = ssh-ed25519
            case "$key_data" in *[!A-Za-z0-9+/=]*|'') exit 1;; esac
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
            if grep -Fq "$key_data" "$HOME/.ssh/authorized_keys"; then echo 'Download key already installed; inspect before granting again'; exit 1; fi
            expires=$(date -u -d '+1 hour' +%Y%m%d%H%M%SZ)
            printf '\nrestrict,expiry-time="%s",command="/bin/cat -- %s/bundle.tar.gz" %s %s itapoa-backup-download-%s\n' "$expires" "$backup" "$key_type" "$key_data" "$BACKUP_RUN_ID" >> "$HOME/.ssh/authorized_keys"
            echo "DOWNLOAD_ONLY_ACCESS_EXPIRES_UTC=$expires"
  revoke-backup-download:
    if: inputs.confirmation == 'revoke-backup-download'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove only the explicitly authorized temporary backup key
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKUP_PUBLIC_KEY: ${{ secrets.ITAPOA_BACKUP_TRANSFER_PUBLIC_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: BACKUP_PUBLIC_KEY
          command_timeout: 2m
          script: |
            set -eu
            umask 077
            read -r key_type key_data ignored <<EOF
            $BACKUP_PUBLIC_KEY
            EOF
            test "$key_type" = ssh-ed25519
            case "$key_data" in *[!A-Za-z0-9+/=]*|'') exit 1;; esac
            test -f "$HOME/.ssh/authorized_keys"
            temporary=$(mktemp "$HOME/.ssh/authorized_keys.backup-cleanup.XXXXXXXX")
            awk -v key="$key_data" '!(index($0,key)>0 && $NF ~ /^itapoa-backup-download-[0-9]+$/)' "$HOME/.ssh/authorized_keys" > "$temporary"
            chmod 600 "$temporary"
            mv "$temporary" "$HOME/.ssh/authorized_keys"
            if grep -F "$key_data" "$HOME/.ssh/authorized_keys" | grep -q 'itapoa-backup-download-'; then exit 1; fi
            echo 'TEMPORARY_DOWNLOAD_ACCESS_REMOVED=OK'
  inspect-backup-access:
    if: inputs.confirmation == 'inspect-backup-access'
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect trusted backup transport (public metadata only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 2m
          script: |
            set -eu
            cat /etc/ssh/ssh_host_ed25519_key.pub
            if [ -s "$HOME/.ssh/authorized_keys" ]; then ssh-keygen -lf "$HOME/.ssh/authorized_keys" || true; fi
            /usr/sbin/sshd -T | grep -E '^(pubkeyauthentication|authorizedkeysfile|permitrootlogin|authenticationmethods|strictmodes) '
            stat -c '%a %u %g %n' "$HOME/.ssh" "$HOME/.ssh/authorized_keys"
            journalctl -u ssh --since '-10 minutes' --no-pager | grep -E 'Authentication refused|bad key options|expired|authorized_keys|Failed publickey' | tail -n 12 || true
            docker service ls --format '{{.Name}} {{.Image}}'
            docker ps -a --filter 'label=com.docker.swarm.service.name=itapoa_itapoa-app' --format '{{.ID}} {{.Status}}'
            docker volume ls --format '{{.Name}}'
  inspect-system:
    if: inputs.confirmation == 'inspect-system'
    runs-on: ubuntu-24.04
    steps:
      - name: Read-only application and persistence audit
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 3m
          script: |
            set -eu
            service=itapoa_itapoa-app
            container=$(docker ps --filter "label=com.docker.swarm.service.name=$service" --format '{{.ID}}' | head -n 1)
            test -n "$container"
            docker service inspect "$service" --format 'image={{.Spec.TaskTemplate.ContainerSpec.Image}} mounts={{json .Spec.TaskTemplate.ContainerSpec.Mounts}} restart={{json .Spec.TaskTemplate.RestartPolicy}}'
            docker service ps "$service" --format '{{.CurrentState}} {{.Image}}'
            docker volume inspect itapoa_itapoa-app_uploads --format '{{.Name}} {{.Mountpoint}}' || true
            if [ -d /var/backups/itapoa ]; then
              find /var/backups/itapoa -maxdepth 2 -type f -name '*sha256*' -print
            fi
            for tool in rclone restic borg; do command -v "$tool" || true; done
            # Legacy paths are inspected only to locate recoverable uploads.
            for legacy in /opt/itapoa/app/uploads /opt/itapoa/uploads; do
              if [ -d "$legacy" ]; then
                printf 'legacy_upload_directory=%s files=' "$legacy"
                find "$legacy" -type f | wc -l
              fi
            done
            find /tmp -maxdepth 1 -type f \( -name 'itapoa_uploads_*.tar.gz' -o -name 'itapoa_dump_*.sql*' -o -name 'checksums.txt' \) -printf 'legacy_backup=%f bytes=%s\n'
            docker volume ls --format '{{.Name}}' | grep -i itapoa || true
            docker exec -i "$container" node - <<'NODE'
            const mysql=require('mysql2/promise'),fs=require('fs'),path=require('path'),crypto=require('crypto');
            (async()=>{
              const dir=path.resolve(process.env.UPLOAD_DIR||'uploads');
              const files=[];
              function walk(p){if(!fs.existsSync(p))return;for(const e of fs.readdirSync(p,{withFileTypes:true})){const n=path.join(p,e.name);if(e.isDirectory())walk(n);else if(e.isFile())files.push(n);}}
              walk(dir);files.sort();
              const manifest=crypto.createHash('sha256');let bytes=0;
              for(const f of files){bytes+=fs.statSync(f).size;manifest.update(path.relative(dir,f));manifest.update(crypto.createHash('sha256').update(fs.readFileSync(f)).digest());}
              console.log(JSON.stringify({uploads:{directory:dir,count:files.length,bytes,manifestSha256:manifest.digest('hex')},release:process.env.RELEASE_SHA||null}));
              const db=await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
              try{
                const [identity]=await db.query('SELECT DATABASE() db, VERSION() version');
                // Diagnose only the privately configured test account. No email,
                // password, hash or reset token is printed or changed.
                if(process.env.PAYMENT_TEST_ACCOUNT_EMAIL){
                  const [account]=await db.query("SELECT COUNT(*) matches, SUM(password IS NOT NULL AND password <> '') passwordsPresent, SUM(password REGEXP '^[$]2[aby][$][0-9]{2}[$]') supportedHashes FROM users WHERE LOWER(TRIM(email))=?",[process.env.PAYMENT_TEST_ACCOUNT_EMAIL.trim().toLowerCase()]);
                  console.log(JSON.stringify({testAccount:{matches:Number(account[0].matches),passwordPresent:Number(account[0].passwordsPresent)===1,bcryptFormatSupported:Number(account[0].supportedHashes)===1}}));
                }
                const [tables]=await db.query('SELECT TABLE_NAME name,ENGINE engine FROM information_schema.tables WHERE TABLE_SCHEMA=DATABASE()');
                const counts={};for(const t of ['users','companies','companies_users','subscriptions','payment_logs','media_items'])counts[t]=(await db.query('SELECT COUNT(*) n FROM `'+t+'`'))[0][0].n;
                const orphans={};for(const [key,sql]of Object.entries({members:'SELECT COUNT(*) n FROM companies_users cu LEFT JOIN companies c ON c.id=cu.company_id LEFT JOIN users u ON u.id=cu.user_id WHERE c.id IS NULL OR u.id IS NULL',subscriptions:'SELECT COUNT(*) n FROM subscriptions s LEFT JOIN companies c ON c.id=s.companyId LEFT JOIN users u ON u.id=s.userId WHERE c.id IS NULL OR u.id IS NULL'}))orphans[key]=(await db.query(sql))[0][0].n;
                const [config]=await db.query('SELECT publicKey,accessToken FROM payment_config WHERE id=?',['payment']);
                const row=config[0]||{};const token=String(row.accessToken||process.env.MERCADOPAGO_ACCESS_TOKEN||'').trim();
                const key=String(row.publicKey||process.env.MERCADOPAGO_PUBLIC_KEY||'').trim();
                const gateway={dbTokenPresent:!!row.accessToken,envTokenPresent:!!process.env.MERCADOPAGO_ACCESS_TOKEN,publicKeyPresent:!!key,webhookSecretPresent:!!(process.env.MERCADOPAGO_WEBHOOK_SECRET||process.env.MP_WEBHOOK_SECRET),mode:process.env.MERCADOPAGO_MODE||'unspecified'};
                if(token){try{const response=await fetch('https://api.mercadopago.com/users/me',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(10000)});gateway.readOnlyIdentityStatus=response.status;}catch{gateway.readOnlyIdentityStatus='network-error';}}
                console.log(JSON.stringify({identity,tables,counts,orphans,gateway,smtp:{hostPresent:!!process.env.SMTP_HOST,passwordPresent:!!(process.env.SMTP_PASSWORD||process.env.SMTP_PASS)}}));
              }finally{await db.end();}
            })().catch(e=>{console.error('Read-only audit failed:',e.code||'unknown');process.exitCode=1;});
            NODE
  inspect:
    if: inputs.confirmation == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect payment database without changing it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 3m
          script: |
            set -eu
            container=$(docker ps --filter 'label=com.docker.swarm.service.name=itapoa_itapoa-app' --format '{{.ID}}' | head -n 1)
            test -n "$container"
            docker service inspect itapoa_itapoa-app --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
            docker ps --format '{{.Names}} {{.Image}}'
            command -v mysqldump || command -v mariadb-dump || true
            df -h /var/lib/docker
            docker exec -i "$container" node - <<'NODE'
            const mysql=require('mysql2/promise');
            (async()=>{
              const db=await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||3306),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
              try {
                const [identity]=await db.query('SELECT DATABASE() db, VERSION() version');
                const [tables]=await db.query('SELECT TABLE_NAME name, ENGINE engine FROM information_schema.tables WHERE TABLE_SCHEMA=DATABASE() ORDER BY TABLE_NAME');
                const [columns]=await db.query("SELECT TABLE_NAME name,COLUMN_NAME col FROM information_schema.columns WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('gateway_payment_state','webhook_events','plans') ORDER BY TABLE_NAME,ORDINAL_POSITION");
                const counts={};for(const t of ['users','companies','subscriptions','payment_logs']) counts[t]=(await db.query('SELECT COUNT(*) n FROM `'+t+'`'))[0][0].n;
                console.log(JSON.stringify({identity,host:process.env.DB_HOST,tables,columns,counts}));
              } finally {await db.end();}
            })().catch(e=>{console.error('Inspection failed:',e.code||'unknown');process.exitCode=1;});
            NODE
  backup-and-migrate:
    if: inputs.confirmation == 'backup-and-migrate-itapoa'
    runs-on: ubuntu-24.04
    steps:
      - name: Backup, isolated restore and additive migration
        uses: appleboy/ssh-action@v1.2.0
        env:
          PAYMENT_MAINTENANCE_CONFIRM: ${{ inputs.confirmation }}
          MAINTENANCE_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: PAYMENT_MAINTENANCE_CONFIRM,MAINTENANCE_RUN_ID
          command_timeout: 10m
          script: |
            set -eu
            umask 077
            test "$PAYMENT_MAINTENANCE_CONFIRM" = backup-and-migrate-itapoa
            source_dir=$(mktemp -d /tmp/itapoa-payment-maintenance.XXXXXXXX)
            git -C "$source_dir" init --quiet
            git -C "$source_dir" remote add origin https://github.com/Ocorrosivo/itapoa-online.git
            git -C "$source_dir" fetch --quiet --depth 1 origin '${{ github.sha }}'
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = '${{ github.sha }}'
            bash -n "$source_dir/scripts/payment-db-maintenance.sh"
            GITHUB_RUN_ID="$MAINTENANCE_RUN_ID" bash "$source_dir/scripts/payment-db-maintenance.sh" "$source_dir"
