name: Full site backup only
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: easypanel-deploy
  cancel-in-progress: false
jobs:
  backup:
    if: inputs.confirmation == 'full-backup-only'
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          BACKUP_PUBLIC_KEY: ${{ secrets.ITAPOA_FULL_BACKUP_PUBLIC_KEY }}
          BACKUP_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: BACKUP_PUBLIC_KEY,BACKUP_RUN_ID
          command_timeout: 30m
          script: |
            set -eu
            umask 077
            source=$(mktemp -d /tmp/itapoa-full-backup.XXXXXXXX)
            git -C "$source" init --quiet
            git -C "$source" remote add origin https://github.com/Ocorrosivo/itapoa-online.git
            git -C "$source" fetch --quiet --depth 1 origin '${{ github.sha }}'
            git -C "$source" checkout --quiet --detach FETCH_HEAD
            bash -n "$source/scripts/full-site-backup.sh"
            bash "$source/scripts/full-site-backup.sh"
  revoke:
    if: inputs.confirmation == 'revoke-full-backup'
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          BACKUP_PUBLIC_KEY: ${{ secrets.ITAPOA_FULL_BACKUP_PUBLIC_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: BACKUP_PUBLIC_KEY
          script: |
            set -eu
            umask 077
            read -r type key ignored <<EOF
            $BACKUP_PUBLIC_KEY
            EOF
            test "$type" = ssh-ed25519
            test -n "$key"
            target=/root/.ssh/authorized_keys
            temp=$(mktemp /root/.ssh/backup-revoke.XXXXXXXX)
            awk -v key="$key" 'index($0,key)==0 || index($0,"itapoa-full-backup-")==0' "$target" > "$temp"
            cat "$temp" > "$target"
            rm -- "$temp"
            if grep -F "$key" "$target" | grep -q itapoa-full-backup-; then exit 1; fi
            echo TEMPORARY_BACKUP_ACCESS_REMOVED
