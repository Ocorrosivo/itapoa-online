name: Deploy Hostinger (bypass API)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build (health check do bundle)
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
          echo "Build OK: dist/server.cjs $(wc -c < dist/server.cjs) bytes"
          ls -lh dist/assets/

      - name: Deploy via SSH (if secrets present)
        if: ${{ secrets.HOSTINGER_HOST != '' && secrets.HOSTINGER_USER != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          source: "dist/*,server.js,package.json,package-lock.json,src/**,database/**,public/**,index.html,vite.config.ts,tsconfig.json"
          target: "${{ secrets.HOSTINGER_TARGET || '~/domains/ajborrachariamovel.com.br' }}"

      - name: Deploy via FTP (fallback)
        if: ${{ secrets.FTP_SERVER != '' && failure() == false }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./domains/ajborrachariamovel.com.br/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Health check (post-deploy)
        run: |
          echo "Aguardando deploy propagar..."
          sleep 30
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" https://ajborrachariamovel.com.br/api/health || echo "000")
            echo "Tentativa $i: /api/health -> $CODE $(cat /tmp/health.json 2>/dev/null | head -c 200)"
            if [ "$CODE" = "200" ]; then
              CODE2=$(curl -s -o /dev/null -w "%{http_code}" https://ajborrachariamovel.com.br/empresa/hamburgueria-itapema-burger || echo "000")
              echo "  /empresa/hamburgueria-itapema-burger -> $CODE2"
              if [ "$CODE2" = "200" ]; then
                JS=$(curl -s https://ajborrachariamovel.com.br/index.html | grep -o 'assets/index-[^"]*\.js' | head -1)
                echo "  JS bundle: $JS"
                # Check that JS contains safeRating (fix marker) not raw rating.toFixed crash
                if curl -s "https://ajborrachariamovel.com.br/$JS" | grep -q "safeRating"; then
                  echo "  Fix marker safeRating encontrado - TELA BRANCA CORRIGIDA"
                else
                  echo "  AVISO: bundle ainda sem safeRating - pode estar cached no CDN"
                fi
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::warning::Health check falhou após 5 tentativas"
          exit 0
